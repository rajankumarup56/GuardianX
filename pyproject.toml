[project]
name = "guardianx"
version = "0.1.0"
description = "Defensive cybersecurity, privacy and safety layer for connected cyber-physical systems."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]